<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Matjar Store</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- Page de connexion -->
    <div id="login-page" class="login-page">
        <div class="login-container">
            <div class="login-logo">Matjar<span>Store</span></div>
            <h2>Espace Admin</h2>
            <p>Connectez-vous pour gérer votre boutique</p>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="login-btn">Se connecter</button>
            </form>
            
            <p class="register-link">
                Première visite ? <a href="#" id="show-register">Créer un compte admin</a>
            </p>
            
            <form id="register-form" class="register-form" style="display: none;">
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Mot de passe</label>
                    <input type="password" id="register-password" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="register-confirm">Confirmer le mot de passe</label>
                    <input type="password" id="register-confirm" minlength="6" required>
                </div>
                <button type="submit" class="login-btn">Créer mon compte</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Admin -->
    <div id="admin-dashboard" class="admin-dashboard" style="display: none;">
        <nav class="admin-nav">
            <div class="admin-nav-container">
                <div class="admin-logo">Matjar<span>Store</span> - Admin</div>
                <div class="admin-nav-links">
                    <button class="nav-btn active" data-tab="products">Produits</button>
                    <button class="nav-btn" data-tab="orders">Commandes</button>
                    <button class="nav-btn" data-tab="settings">Paramètres</button>
                    <button class="logout-btn" id="logout-btn">Déconnexion</button>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">
            <!-- Onglet Produits -->
            <div id="tab-products" class="tab-content active">
                <div class="tab-header">
                    <h2>Gestion des Produits</h2>
                    <button class="add-product-btn" id="add-product-btn">+ Ajouter un produit</button>
                </div>
                
                <div id="product-form-container" class="product-form-container" style="display: none;">
                    <form id="product-form" class="product-form">
                        <h3 id="product-form-title">Ajouter un produit</h3>
                        <input type="hidden" id="product-id">
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="product-name">Nom du produit *</label>
                                <input type="text" id="product-name" required>
                            </div>
                            <div class="form-group">
                                <label for="product-price">Prix (DZD) *</label>
                                <input type="number" id="product-price" min="0" required>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="product-old-price">Ancien prix (promotion)</label>
                                <input type="number" id="product-old-price" min="0">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="product-image-url">Image URL (collez un lien)</label>
                            <input type="text" id="product-image-url" placeholder="https://exemple.com/image.jpg">
                        </div>
                        
                        <div class="form-group">
                            <label for="product-image">OU uploader depuis votre ordinateur</label>
                            <input type="file" id="product-image" accept="image/*">
                            <small style="color: #666; font-size: 0.8rem;">Choisissez une image (jpg, png, webp) - Max 2MB</small>
                        </div>
                        
                        <div class="form-group">
    <label for="product-description">Description (optionnel)</label>
    <textarea id="product-description" rows="3"></textarea>
</div>
                        <div class="form-group">
                            <label for="product-html">Description HTML personnalisée (optionnel)</label>
                            <textarea id="product-html" rows="5" placeholder="<p>Description avec <strong>HTML</strong></p>"></textarea>
                        </div>
                        
                        <div class="form-group checkbox-group">
                            <label>
                                <input type="checkbox" id="product-promotion">
                                Activer la promotion
                            </label>
                            <label>
                                <input type="checkbox" id="product-stock" checked>
                                En stock
                            </label>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="save-btn">Enregistrer</button>
                            <button type="button" class="cancel-btn" id="cancel-product-btn">Annuler</button>
                        </div>
                    </form>
                </div>
                
                <div id="admin-products-list" class="admin-products-list">
                    <!-- Les produits seront affichés ici -->
                </div>
            </div>
            
            <!-- Onglet Commandes -->
            <div id="tab-orders" class="tab-content">
                <div class="tab-header">
                    <h2>Commandes reçues</h2>
                    <button onclick="clearAllOrders()" style="background: #e74c3c; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 5px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.9rem;">
                        🗑️ Tout effacer
                    </button>
                </div>
                <div id="admin-orders-list" class="admin-orders-list">
                    <!-- Les commandes seront affichées ici -->
                </div>
            </div>
            
            <!-- Onglet Paramètres -->
            <div id="tab-settings" class="tab-content">
                <div class="tab-header">
                    <h2>Paramètres</h2>
                </div>
                
                <div class="settings-container">
                    <h3>Livraison en Algérie</h3>
                    <form id="settings-form" class="settings-form">
                        <div class="form-group">
                            <label for="delivery-fee">Frais de livraison (DZD)</label>
                            <input type="number" id="delivery-fee" min="0" value="500">
                        </div>
                        <div class="form-group">
                            <label for="delivery-time">Délai de livraison</label>
                            <input type="text" id="delivery-time" value="2-5 jours ouvrés">
                        </div>
                        <div class="form-group">
                            <label>Wilayas desservies</label>
                            <div class="wilayas-container">
                                <div class="wilayas-header">
                                    <button type="button" class="select-all-btn" onclick="toggleAllWilayas(true)">Tout sélectionner</button>
                                    <button type="button" class="deselect-all-btn" onclick="toggleAllWilayas(false)">Tout désélectionner</button>
                                </div>
                                <div id="wilayas-list" class="wilayas-list"></div>
                            </div>
                        </div>
                        <button type="submit" class="save-btn">Enregistrer les paramètres</button>
                    </form>
                </div>
                
                <div class="settings-container custom-style-container">
                    <h3>Personnalisation du style</h3>
                    <form id="custom-style-form" class="settings-form">
                        <div class="form-group">
                            <label for="custom-css">CSS personnalisé</label>
                            <textarea id="custom-css" rows="10" placeholder="Collez votre CSS ici..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="custom-font">Police personnalisée (Google Fonts)</label>
                            <input type="text" id="custom-font" placeholder="Ex: Poppins, Roboto, Lato...">
                        </div>
                        <div class="form-group">
                            <label for="primary-color">Couleur principale</label>
                            <input type="color" id="primary-color" value="#c9a96e">
                        </div>
                        <div class="form-group">
                            <label for="hero-title">Titre principal</label>
                            <input type="text" id="hero-title" value="Révélez votre beauté naturelle">
                        </div>
                        <div class="form-group">
                            <label for="hero-subtitle">Sous-titre</label>
                            <input type="text" id="hero-subtitle" value="Cosmétiques Naturels">
                        </div>
                        <button type="submit" class="save-btn">Enregistrer le style</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"defer></script>
</body>
</html>
